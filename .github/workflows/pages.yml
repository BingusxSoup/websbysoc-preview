name: Validate static site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Confirm homepage exists
        run: |
          test -f index.html
          grep -q "Digital Craftsmanship for the Modern Brand" index.html
